<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ملازمي التعليمية - المراجعة المركزة في الكيمياء</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .badge {
            display: inline-block;
            background-color: #e67e22;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .book-info {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: right;
            border-right: 4px solid #2980b9;
        }
        .book-info p {
            margin: 8px 0;
            font-size: 15px;
            color: #555;
        }
        .buttons-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            color: white;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-download { background-color: #27ae60; }
        .btn-telegram { background-color: #24a1de; }
        .btn-whatsapp { background-color: #25d366; }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">إصدار 2026</span>
        <h1>المراجعة المركزة في الكيمياء</h1>
        <p>للثالث المتوسط - الأستاذ حسين حمزة</p>

        <div class="book-info">
            <p><strong>المادة:</strong> الكيمياء</p>
            <p><strong>المرحلة:</strong> الثالث المتوسط</p>
            <p><strong>الأستاذ:</strong> حسين حمزة</p>
            <p><strong>محتوى الملزمة:</strong> ملخص الفصول، الأسئلة الوزارية، والاجوبة النموذجية.</p>
        </div>

        <div class="buttons-grid">
            <a href="#" class="btn btn-download">تحميل الملزمة (PDF)</a>
            <a href="https://t.me/YOUR_BOT_USERNAME" class="btn btn-telegram" target="_blank">طلب وتحميل عبر التليجرام</a>
            <a href="https://wa.me/YOUR_PHONE_NUMBER" class="btn btn-whatsapp" target="_blank">شراء / استفسار عبر الواتساب</a>
        </div>
    </div>

</body>
</html>
